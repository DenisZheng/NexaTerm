name: Legacy protocol core
on:
  pull_request:
    paths:
      - 'src-tauri/src/rlogin/**'
      - 'src-tauri/src/legacy_socket/**'
      - 'src-tauri/src/rlogin_native/**'
      - 'src-tauri/src/rlogin_connect/**'
      - 'src-tauri/test-fixtures/legacy-socket-harness/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/legacy-protocol.yml'
permissions:
  contents: read
concurrency:
  group: legacy-protocol-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wire:
    name: Native legacy transport (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run the production wire module with actual loopback TCP
        shell: python
        run: |
          import os, pathlib, subprocess
          executable = pathlib.Path(os.environ['RUNNER_TEMP']) / ('rlogin-wire-tests.exe' if os.name == 'nt' else 'rlogin-wire-tests')
          subprocess.run(['rustc', '--edition=2021', '--test', 'src-tauri/src/rlogin/mod.rs', '-o', str(executable)], check=True)
          subprocess.run([str(executable), '--nocapture'], check=True)
      - name: Reuse application dependency pins for the native socket harness
        shell: python
        run: |
          import shutil
          shutil.copyfile('src-tauri/Cargo.lock', 'src-tauri/test-fixtures/legacy-socket-harness/Cargo.lock')
      - name: Run production native sockets and OOB over real loopback TCP
        run: cargo test --manifest-path src-tauri/test-fixtures/legacy-socket-harness/Cargo.toml -- --nocapture
      - name: Require native harness dependencies to stay inside the application lockfile
        if: always()
        shell: python
        run: |
          import pathlib, tomllib
          original = tomllib.loads(pathlib.Path('src-tauri/Cargo.lock').read_text())
          actual = tomllib.loads(pathlib.Path('src-tauri/test-fixtures/legacy-socket-harness/Cargo.lock').read_text())
          expected = {(p['name'], p['version'], p.get('checksum')) for p in original['package']}
          unexpected = [p['name'] for p in actual['package'] if p['name'] != 'nexaterm-legacy-socket-harness' and (p['name'], p['version'], p.get('checksum')) not in expected]
          assert not unexpected, f'native harness introduced unreviewed dependencies: {unexpected}'
