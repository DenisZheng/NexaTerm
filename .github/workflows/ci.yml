name: CI

# 常规集成校验工作流：push/PR/手动触发。
# 目的是在具备完整工具链的 GitHub runner 上跑前端类型检查、构建、脚本单测，
# 以及 Rust 三平台的 cargo check / cargo test —— 解锁本地 Windows 因 MSVC/SDK
# 不完整而无法执行的 Rust 编译验收（Task 01 的 Batch B / Phase 3 / Phase 4 依赖此项）。
# 与 release.yml 的区别：本工作流不打包、不签名、不发布，因此不触发 updater 签名门禁。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/PR 的新提交取消尚在排队或运行的旧 CI，节省 runner 额度。
# 分组带上 event_name：手动触发的打包（耗时远长于检查）与 push/PR 检查互不取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # 前端 / JS 侧：只跑已知稳定的核心校验。
  # 注意：scripts/check-*.mjs 共 60 个，其中若干属其它 feature 未完成项，当前会失败，
  # 故此处不做全量遍历，只跑与本任务相关且稳定通过的项，避免 CI 一建立即变红。
  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Build frontend
        run: pnpm run build

      - name: Script unit tests
        run: node --test scripts/*.test.mjs

      - name: Startup module boundary
        run: node scripts/check-startup-module-boundary-source.mjs

  # Rust 侧：三平台矩阵，独立看结果（fail-fast: false）。
  # cargo check 确认编译通过；cargo test 驱动 src-tauri 内 250+ 个单元/集成测试。
  # 这是本机 Windows 一直无法执行的验收项，改由 CI 承担。
  rust:
    name: Rust ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: windows-latest
            target: windows-x64
          - runner: macos-26
            target: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux 上 cargo check 一个依赖 tauri 的 crate 需要 WebKitGTK 等系统库，
      # 否则 build script / pkg-config 解析失败；沿用 release.yml 已验证的依赖列表。
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libudev-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --workspace --locked

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --workspace --locked

  # 手动触发的 Windows 打包验证通道（build only），用于确认打包链路可用并拿到可安装包试用。
  # 与 release.yml 的关键区别：这里**不设** MXTERM_CREATE_UPDATER_ARTIFACTS，
  # 因此 scripts/build-platform.mjs 不会追加 createUpdaterArtifacts（见其第 77 行），
  # 也就不生成 updater 产物、不需要 TAURI_SIGNING_PRIVATE_KEY，绕开发布签名门禁。
  # 同时不发布 Release、不生成 latest.json，完全不触碰发布信任链。
  # 代价：产物没有 updater 签名，无法用于自动更新，仅供验证与试用安装。
  package-windows:
    name: Package windows-x64 (build only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri.conf.json 的 beforeBuildCommand 已包含 `pnpm build && pnpm build:mcp-sidecar`，
      # 前端与 MCP sidecar 会在打包过程中自动构建，此处无需重复。
      - name: Build Windows bundle
        run: pnpm run package:win

      # scripts/build-platform.mjs 的 win-x64 计划是 `tauri build --bundles nsis`，
      # 只产出 NSIS 安装包，故此处不收集 msi。
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexaterm-windows-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
