name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=4096
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            package_script: package:win
            bundle_root: src-tauri/target/release/bundle
          - runner: macos-26
            target: macos-arm64
            package_script: package:mac-arm64
            bundle_root: src-tauri/target/aarch64-apple-darwin/release/bundle
          - runner: ubuntu-22.04
            target: linux-x64
            package_script: package:linux
            bundle_root: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: matrix.target == 'macos-arm64'
        run: rustup target add aarch64-apple-darwin

      - name: Add Linux target
        if: matrix.target == 'linux-x64'
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libudev-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            rpm \
            wget

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check third-party licenses
        run: pnpm run check:licenses

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(node -e "const fs=require('fs'); const text=fs.readFileSync('src-tauri/Cargo.toml','utf8'); const head=text.split('\n[lib]')[0]; const match=head.match(/^version\\s*=\\s*\"([^\"]+)\"/m); if (!match) process.exit(2); process.stdout.write(match[1]);")"

          if [ "$tag" != "$package_version" ]; then
            echo "::error::Tag v$tag does not match package.json version $package_version"
            exit 1
          fi

          if [ "$tag" != "$tauri_version" ]; then
            echo "::error::Tag v$tag does not match src-tauri/tauri.conf.json version $tauri_version"
            exit 1
          fi

          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag v$tag does not match src-tauri/Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY secret. GitHub Release updater artifacts must be signed."
            exit 1
          fi

      - name: Import Windows Authenticode certificate
        if: startsWith(github.ref, 'refs/tags/v') && matrix.target == 'windows-x64'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Missing WINDOWS_CERTIFICATE or WINDOWS_CERTIFICATE_PASSWORD secret for tagged release."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "nexaterm-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if (-not $certificate) {
              throw "Imported PFX did not provide a certificate with a private key."
            }
            "NEXATERM_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "NEXATERM_WINDOWS_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
          }

      - name: Import macOS Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v') && matrix.target == 'macos-arm64'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing ${name} secret for tagged macOS release."
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/nexaterm-signing.p12"
          keychain_path="$RUNNER_TEMP/nexaterm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$signing_identity" ]; then
            echo "::error::No Developer ID Application identity found in imported certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "NEXATERM_MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: Build platform bundle
        env:
          MXTERM_CREATE_UPDATER_ARTIFACTS: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run ${{ matrix.package_script }}

      - name: Verify Windows Authenticode signatures
        if: startsWith(github.ref, 'refs/tags/v') && matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @("src-tauri/target/release/nexaterm.exe")
          $targets += Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | ForEach-Object { $_.FullName }
          if ($targets.Count -lt 2) {
            throw "Expected the NexaTerm binary and at least one NSIS installer for signature verification."
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature: $target ($($signature.Status))"
            }
            Write-Host "Verified Authenticode signature: $target"
          }

      - name: Verify macOS Developer ID signature and notarization
        if: startsWith(github.ref, 'refs/tags/v') && matrix.target == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -type d -name 'NexaTerm.app' -print -quit)"
          dmg_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -type f -name '*.dmg' -print -quit)"
          if [ -z "$app_path" ] || [ -z "$dmg_path" ]; then
            echo "::error::Expected signed .app and notarized .dmg outputs."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundle_root="${{ matrix.bundle_root }}"

          if [ ! -d "$bundle_root" ]; then
            echo "::error::Bundle output not found: $bundle_root"
            exit 1
          fi

          node scripts/release-assets.mjs \
            --bundle-root "$bundle_root" \
            --out-dir release-assets \
            --artifact "${{ matrix.target }}"

          cp logs/licenses/THIRD_PARTY_LICENSES.generated.md \
            "release-assets/THIRD_PARTY_LICENSES-${{ matrix.target }}.generated.md"
          cp logs/licenses/license-inventory.json \
            "release-assets/license-inventory-${{ matrix.target }}.json"

          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            portable_root="release-assets/NexaTerm-portable"
            mkdir -p "$portable_root"
            find src-tauri/target/release -mindepth 1 -maxdepth 1 \
              ! -name bundle \
              ! -name build \
              ! -name deps \
              ! -name _up_ \
              ! -name incremental \
              -exec cp -R {} "$portable_root/" \;

            if [ -d "src-tauri/target/release/_up_" ]; then
              cp -R src-tauri/target/release/_up_ "$portable_root/_up_"
            fi

            cp LICENSE THIRD_PARTY_LICENSES.md "$portable_root/"
            printf "portable\n" > "$portable_root/portable.marker"
            powershell -NoProfile -Command "Compress-Archive -Path 'release-assets/NexaTerm-portable/*' -DestinationPath 'release-assets/NexaTerm-portable-windows-x64.zip' -Force"
            rm -rf "$portable_root"
          fi

          if [ "$(find release-assets -type f | wc -l | tr -d ' ')" = "0" ]; then
            echo "::error::No release assets were collected"
            exit 1
          fi

          find release-assets -type f -print | sort

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexaterm-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  prepare:
    name: Prepare release assets
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-assets
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
          else
            version="$(node -p "require('./package.json').version")"
            release_tag="v${version}"
            echo "Manual validation mode: preparing assets for ${release_tag}, but no GitHub Release will be created."
          fi
          prefix="NexaTerm-${version}/"

          mkdir -p release-assets
          find downloaded-assets -maxdepth 1 -type f -exec cp {} release-assets/ \;
          cp LICENSE THIRD_PARTY_LICENSES.md release-assets/

          git archive --format=zip --prefix="$prefix" -o "release-assets/nexaterm-${version}-source.zip" HEAD
          git archive --format=tar --prefix="$prefix" HEAD | gzip -9 > "release-assets/nexaterm-${version}-source.tar.gz"

          node scripts/generate-latest-json.mjs release-assets "DenisZheng/NexaTerm" "$release_tag" "$version"

          (
            cd release-assets
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v4
        with:
          name: nexaterm-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download prepared release assets
        uses: actions/download-artifact@v4
        with:
          name: nexaterm-release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
