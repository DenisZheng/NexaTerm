[package]
name = "nexaterm-legacy-socket-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "=1.53.1", features = ["net", "rt", "sync", "time"] }
uuid = { version = "=1.26.1", features = ["v4"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
encoding_rs = "=0.8.41"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Networking_WinSock"] }
