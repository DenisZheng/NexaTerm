name: nexaterm-fixtures

# Real-environment test fixtures for acceptance items A12 (jump-host SSH +
# tunnels) and A13 (SSH X11). See README.md in this directory.
#
# No secrets are committed: the SSH keypair is generated on the host by
# fixtures.mjs at `up` time and mounted read-only into the sshd containers.

services:
  ssh-jump:
    build: ./sshd
    ports:
      - "2222:22"
    volumes:
      - ./keys:/keys:ro

  # Deliberately no published ports: reachable only through ssh-jump.
  # This legacy one-jump target stays unchanged for WF-03 / WF-06A checks.
  ssh-target:
    build: ./sshd
    volumes:
      - ./keys:/keys:ro

  # WF-06B true two-level Jump chain:
  # host -> ssh-jump-outer -> ssh-jump-inner -> ssh-multihop-target.
  # The outer and target services share no Docker network, so the target cannot
  # be reached by skipping ssh-jump-inner.
  ssh-jump-outer:
    build: ./sshd
    ports:
      - "2224:22"
    volumes:
      - ./keys:/keys:ro
    networks:
      - wf06b-edge

  ssh-jump-inner:
    build: ./sshd
    volumes:
      - ./keys:/keys:ro
    networks:
      - wf06b-edge
      - wf06b-target

  ssh-multihop-target:
    build: ./sshd
    volumes:
      - ./keys:/keys:ro
    networks:
      - wf06b-target

  ssh-x11:
    build: ./sshd
    ports:
      - "2223:22"
    volumes:
      - ./keys:/keys:ro
    environment:
      ENABLE_X11: "yes"

  xrdp:
    build: ./xrdp
    ports:
      - "3389:3389"

  vnc:
    build: ./vnc
    ports:
      - "5901:5901"

networks:
  wf06b-edge:
  wf06b-target:
